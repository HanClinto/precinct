name: Publish ORC Release ZIP

on:
  push:
    branches: [main]
    paths:
      - reference/ohio-revised-code/data/formatted/**
      - reference/ohio-revised-code/code/**
      - .github/workflows/orc-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Ohio Revised Code
        run: |
          cd reference/ohio-revised-code/data/formatted
          zip -r "$GITHUB_WORKSPACE/ohio-revised-code.zip" .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete orc-latest --yes --cleanup-tag || true
          git tag -f orc-latest
          git push origin :refs/tags/orc-latest || true
          git push origin orc-latest
          gh release create orc-latest \
            ohio-revised-code.zip \
            --title "Ohio Revised Code" \
            --notes "Collected formatted Markdown and metadata for the full Ohio Revised Code mirror." \
            --latest=false

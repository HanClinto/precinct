name: Publish ORC Release ZIP

on:
  push:
    branches: [main]
    paths:
      - reference/ohio-revised-code/data/formatted/**
      - reference/ohio-revised-code/code/**
      - .github/workflows/orc-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Ohio Revised Code Title 35
        run: |
          cd reference/ohio-revised-code/data/formatted
          zip -r "$GITHUB_WORKSPACE/ohio-revised-code-title-35.zip" "Title 35 - Elections"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete orc-title-35-latest --yes --cleanup-tag || true
          git tag -f orc-title-35-latest
          git push origin :refs/tags/orc-title-35-latest || true
          git push origin orc-title-35-latest
          gh release create orc-title-35-latest \
            ohio-revised-code-title-35.zip \
            --title "Ohio Revised Code Title 35" \
            --notes "Collected formatted Markdown and metadata for Ohio Revised Code Title 35 - Elections." \
            --latest=false
